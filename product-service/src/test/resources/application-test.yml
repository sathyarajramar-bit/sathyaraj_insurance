spring:
  datasource:
    url: jdbc:h2:mem:product_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
  # In-memory cache: the @Cacheable/@CacheEvict semantics are exercised without a Redis server.
  cache:
    type: simple
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

eureka:
  client:
    enabled: false

security:
  jwt:
    secret: test-only-jwt-secret-with-at-least-32-characters
    issuer: insurance-platform
  public-paths:
    - "GET /api/products/**"
