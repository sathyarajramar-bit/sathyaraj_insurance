# Bootstrap configuration only; everything else comes from the Config Server (config/product-service.yml).
spring:
  application:
    name: product-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config-user}
      password: ${CONFIG_SERVER_PASSWORD:config-pass}
      fail-fast: ${CONFIG_FAIL_FAST:false}

server:
  port: ${SERVER_PORT:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Laptops have several adapters (VPN, Wi-Fi, virtual) and IPs change: registering as localhost is the
    # only address that always works locally. Docker sets EUREKA_PREFER_IP=true so containers register their IP.
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
