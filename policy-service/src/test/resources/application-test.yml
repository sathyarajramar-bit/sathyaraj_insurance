spring:
  datasource:
    url: jdbc:h2:mem:policy_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

eureka:
  client:
    enabled: false

security:
  jwt:
    secret: test-only-jwt-secret-with-at-least-32-characters
    issuer: insurance-platform

notifications:
  enabled: false

resilience4j:
  retry:
    instances:
      proposal-service:
        max-attempts: 2
        wait-duration: 10ms
      payment-service:
        max-attempts: 2
        wait-duration: 10ms

policy:
  renewal-window-days: 30
  renewal-grace-days: 30
  reminder-days-before: 30,15,7
  jobs:
    expiry-cron: "-"
    reminder-cron: "-"
