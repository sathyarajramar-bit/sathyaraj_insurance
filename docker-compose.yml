      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-insurance}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-insurance}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DOCUMENT_STORAGE_DIR: /data/documents
    volumes:
      - document-data:/data/documents
    depends_on:
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
