      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - insurance-net

  document-service:
    build:
      context: .
      dockerfile: document-service/Dockerfile
    container_name: document-service
    ports:
      - "8089:8089"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-config-user}
