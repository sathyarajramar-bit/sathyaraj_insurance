# Local bootstrap configuration only. Routes, CORS, timeouts and security rules come from the
# Config Server (config/api-gateway.yml) and override anything here.

spring:
  application:
    name: api-gateway
  config:
    # "optional:" lets the gateway start without a Config Server (useful on a laptop and in tests).
    # Set CONFIG_FAIL_FAST=true (docker-compose does) to refuse to start without configuration instead.
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config-user}
      password: ${CONFIG_SERVER_PASSWORD:config-pass}
      fail-fast: ${CONFIG_FAIL_FAST:false}
      retry:
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.5
        max-attempts: 10

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Laptops have several adapters (VPN, Wi-Fi, virtual) and IPs change: registering as localhost is the
    # only address that always works locally. Docker sets EUREKA_PREFER_IP=true so containers register their IP.
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.insurance.gateway: INFO
    org.springframework.cloud.gateway: INFO
