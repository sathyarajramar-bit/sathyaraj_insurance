server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:retail_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:System}
    hikari:
      maximum-pool-size: 10
  flyway:
    # All services share the retail_db schema: each one keeps its own history table so their
    # independent V1.. scripts do not collide.
    table: flyway_history_auth_service

security:
  # No token needed for these (the gateway has the same list). Everything else requires a JWT.
  public-paths:
    - /api/auth/register
    - /api/auth/login
    - /api/auth/refresh

auth:
  admin:
    email: ${ADMIN_EMAIL:admin@insurance.local}
    password: ${ADMIN_PASSWORD:}
