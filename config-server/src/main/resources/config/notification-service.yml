server:
  port: ${SERVER_PORT:8088}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:retail_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:System}
    hikari:
      maximum-pool-size: 10
  flyway:
    # All services share the retail_db schema: each one keeps its own history table so their
    # independent V1.. scripts do not collide.
    table: flyway_history_notification_service
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  # SMTP relay used by SmtpEmailProvider (only when notification.email.provider=SMTP). Defaults are Gmail:
  # enable 2-Step Verification on the Google account and create an App Password (myaccount.google.com/apppasswords);
  # the normal account password is rejected. Port 587 + STARTTLS; use 465 with mail.smtp.ssl.enable=true instead if
  # 587 is blocked on your network.
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

notification:
  email:
    provider: ${NOTIFICATION_EMAIL_PROVIDER:MOCK}   # MOCK logs the message; SMTP sends through spring.mail (Gmail)
    from: ${NOTIFICATION_EMAIL_FROM:${GMAIL_USERNAME:}}   # Gmail rewrites From to the account unless it is a verified alias
    from-name: ${NOTIFICATION_EMAIL_FROM_NAME:Insurance Platform}
  sms:
    provider: ${NOTIFICATION_SMS_PROVIDER:MOCK}
  sms-enabled: ${NOTIFICATION_SMS_ENABLED:true}
  retry:
    cron: ${NOTIFICATION_RETRY_CRON:0 */5 * * * *}
    max-attempts: 5

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.insurance.common.exception.BusinessException
    instances:
      customer-service:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.insurance.common.exception.BusinessException
    instances:
      customer-service:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries
  health:
    circuitbreakers:
      enabled: true
    mail:
      # The mail health indicator opens an SMTP connection on every /actuator/health call; keep the probe cheap and
      # local (delivery failures already surface as FAILED rows + retries).
      enabled: false
