# Profile "h2": run any business service on a laptop without MySQL.
# H2 in MySQL compatibility mode runs the same Flyway scripts. Data is kept in ./data/<service>.mv.db.
spring:
  datasource:
    url: jdbc:h2:file:./data/${spring.application.name};MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
