server:
  port: ${SERVER_PORT:8086}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:retail_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:System}
    hikari:
      maximum-pool-size: 10
  flyway:
    # All services share the retail_db schema: each one keeps its own history table so their
    # independent V1.. scripts do not collide.
    table: flyway_history_payment_service
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

payment:
  currency: INR
  outbox:
    cron: ${PAYMENT_OUTBOX_CRON:0 * * * * *}   # redeliver PENDING PaymentSuccessful events every minute
    max-attempts: 10
    backoff-seconds: 30

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.insurance.common.exception.BusinessException
    instances:
      proposal-service:
        base-config: default
      policy-service:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.insurance.common.exception.BusinessException
    instances:
      proposal-service:
        base-config: default
      policy-service:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries
  health:
    circuitbreakers:
      enabled: true
