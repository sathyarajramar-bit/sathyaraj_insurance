server:
  port: ${SERVER_PORT:8089}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:retail_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:System}
    hikari:
      maximum-pool-size: 10
  flyway:
    # All services share the retail_db schema: each one keeps its own history table so their
    # independent V1.. scripts do not collide.
    table: flyway_history_document_service
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${DOCUMENT_MAX_FILE_SIZE:10MB}

document:
  storage:
    provider: ${DOCUMENT_STORAGE_PROVIDER:LOCAL}      # LOCAL today; an S3 adapter selects itself with S3
    local-dir: ${DOCUMENT_STORAGE_DIR:./data/documents}
  allowed-content-types: application/pdf,image/jpeg,image/png,text/plain
  max-size-bytes: 10485760
