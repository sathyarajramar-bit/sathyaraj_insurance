# Shared by EVERY client service (lowest precedence). Service specific files override these values.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 10
  instance:
    # Laptops have several adapters (VPN, Wi-Fi, virtual) and IPs change: registering as localhost is the
    # only address that always works locally. Docker sets EUREKA_PREFER_IP=true so containers register their IP.
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    # Faster failure detection than the 30s/90s defaults; fine for a small cluster.
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true

# ---- Shared by all business services (ignored by services without JPA) ----
spring:
  jpa:
    open-in-view: false            # no lazy loading from controllers/serialisers; transactions end in the service
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate only checks the mapping matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC   # Instant columns are plain DATETIME(6) in UTC on every database
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Services share one schema, so every service after the first sees a non-empty schema and gets baselined.
    # The default baseline version (1) would skip each service's own V1 script; 0 lets V1.. run normally.
    baseline-version: 0
  data:
    web:
      pageable:
        max-page-size: 100         # caps ?size= so a client cannot ask for a million rows
        default-page-size: 20
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${spring.application.name}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                                    # leader + all in-sync replicas acknowledged before send() completes
      properties:
        enable.idempotence: true                   # broker de-duplicates producer retries (no double records on retry)
        spring.json.add.type.headers: false        # consumers choose their own class; payload is plain JSON
        interceptor.classes: com.insurance.common.messaging.CorrelationIdProducerInterceptor
    consumer:
      group-id: ${spring.application.name}        # one consumer group per service: each service sees every record once
      auto-offset-reset: earliest                  # a brand-new group starts from the beginning of the topic
      enable-auto-commit: false                    # the listener container commits after the record is processed
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.insurance.*
        spring.json.use.type.headers: false        # each @KafkaListener declares spring.json.value.default.type
        max.poll.records: 50
    listener:
      ack-mode: record                             # commit the offset after each record (at-least-once)
      missing-topics-fatal: false

security:
  jwt:
    # Same secret the gateway verifies with. The default is for local development only.
    secret: ${JWT_SECRET:insurance-dev-only-jwt-secret-change-me-0123456789}
    issuer: insurance-platform
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}

logging:
  level:
    root: INFO
    com.insurance: INFO
  pattern:
    # correlation id in every line: grep one id across gateway and service logs
    level: "%5p [${spring.application.name:-},%X{correlationId:-}]"

# ---- Messaging (Kafka) ----
# KAFKA_ENABLED=false (default): payment -> policy goes through the outbox over HTTP and notifications over Feign,
# exactly as before. KAFKA_ENABLED=true: the outbox publishes to payment.succeeded, policy-service consumes it,
# and every NotificationPublisher publishes to notification.requested, consumed by notification-service.
# Topics are created at startup by KafkaAdmin from the NewTopic beans in common-lib (CommonKafkaAutoConfiguration).
messaging:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    partitions: 3
    topics:
      payment-succeeded: payment.succeeded
      notification-requested: notification.requested
    consumer:
      max-retries: 3            # then the record goes to <topic>.DLT
      initial-backoff-ms: 1000
      max-backoff-ms: 10000

