server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/customer_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:insurance}
    password: ${MYSQL_PASSWORD:insurance}
    hikari:
      maximum-pool-size: 10

customer:
  vehicle:
    max-age-years: 20          # eligibility: vehicles older than this cannot be registered for insurance
  minimum-age-years: 18
