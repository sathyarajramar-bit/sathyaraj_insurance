spring:
  datasource:
    url: jdbc:h2:mem:document_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC
  flyway:
    enabled: true

eureka:
  client:
    enabled: false

security:
  jwt:
    secret: test-only-jwt-secret-with-at-least-32-characters
    issuer: insurance-platform

document:
  storage:
    provider: LOCAL
    local-dir: ./target/test-documents
  allowed-content-types: application/pdf,image/jpeg,image/png,text/plain
  max-size-bytes: 1024
