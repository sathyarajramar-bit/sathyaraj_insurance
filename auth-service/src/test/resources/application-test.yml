spring:
  datasource:
    url: jdbc:h2:mem:auth_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

eureka:
  client:
    enabled: false

security:
  jwt:
    secret: test-only-jwt-secret-with-at-least-32-characters
    issuer: insurance-platform
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  public-paths:
    - /api/auth/register
    - /api/auth/login
    - /api/auth/refresh

auth:
  admin:
    email: admin@test.local
    password: Admin1234

notifications:
  enabled: false
